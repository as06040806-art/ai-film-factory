
name: AI Film Factory

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  make-film:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Generate MP4
        run: python main.py

      - name: Upload finished video
        uses: actions/upload-artifact@v4
        with:
          name: ai-film-factory-video
          path: output/*.mp4
          if-no-files-found: error
          retention-days: 7
  
